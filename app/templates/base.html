<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Hunt Helper{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-layout">

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a class="brand" href="/jobs">
                    <i class="bi bi-briefcase-fill me-2"></i>Job Hunt Helper
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'jobs' %}active{% endif %}" href="/jobs">
                            <i class="bi bi-search"></i> Jobs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'resumes' %}active{% endif %}" href="/resumes">
                            <i class="bi bi-file-earmark-person"></i> Resumes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'applications' %}active{% endif %}" href="/applications">
                            <i class="bi bi-send"></i> Applications
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'interviews' %}active{% endif %}" href="/interviews">
                            <i class="bi bi-chat-dots"></i> Interview Prep
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <p class="small text-muted mb-0">&copy; 2026 Job Hunt Helper</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">

            <!-- Flash messages are handled by main.js via showAlert() -->
            
            <main class="main-content">
                <div class="container-fluid py-4">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    {% block modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
